<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>手机设备信息检测</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 7vw, 34px);
    }

    .intro {
      margin: 0 0 20px;
      color: #5c667a;
      line-height: 1.6;
    }

    .card {
      overflow: hidden;
      border: 1px solid #dbe2ee;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(40 60 100 / 8%);
    }

    dl { margin: 0; }

    .row {
      display: grid;
      grid-template-columns: minmax(120px, 35%) 1fr;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #edf0f5;
    }

    .row:last-child { border-bottom: 0; }

    dt {
      color: #667085;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      color: #fff;
      background: #246bfd;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button.secondary {
      color: #26334d;
      background: #e8edf6;
    }

    button:disabled { opacity: .6; }

    #status {
      min-height: 24px;
      margin: 12px 2px 0;
      color: #157347;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 420px) {
      .row { grid-template-columns: 1fr; gap: 5px; }
    }

    @media (prefers-color-scheme: dark) {
      :root { color: #e8ecf5; background: #111827; }
      .intro, dt { color: #aab4c6; }
      .card { border-color: #344057; background: #1b2434; box-shadow: none; }
      .row { border-color: #303b50; }
      button.secondary { color: #e8ecf5; background: #344057; }
    }
  </style>
</head>
<body>
  <main>
    <h1>手机设备信息</h1>
    <p class="intro">页面只读取浏览器允许公开的信息，不会上传数据。部分字段受浏览器隐私策略影响，可能显示“不支持”或为空。</p>

    <section class="card" aria-label="设备信息">
      <dl id="deviceInfo"><div class="row"><dt>检测状态</dt><dd>正在检测…</dd></div></dl>
    </section>

    <div class="actions">
      <button id="copyButton" type="button" disabled>复制全部信息</button>
      <button id="refreshButton" class="secondary" type="button">刷新检测</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="./device-model-brands.js"></script>
  <script>
    const infoElement = document.querySelector('#deviceInfo');
    const copyButton = document.querySelector('#copyButton');
    const refreshButton = document.querySelector('#refreshButton');
    const statusElement = document.querySelector('#status');
    let latestInfo = {};

    const modelBrandCatalog = window.DEVICE_MODEL_BRANDS || Object.create(null);

    const displayValue = (value) => {
      if (value === undefined) return '不支持';
      if (value === null || value === '') return '空';
      if (Array.isArray(value)) return value.length ? JSON.stringify(value, null, 2) : '[]';
      return String(value);
    };

    const getDeviceModel = (ua, clientHintModel = '') => {
      const hintedModel = clientHintModel.trim();
      if (hintedModel && !/^(K|Mobile|wv)$/i.test(hintedModel)) return hintedModel;

      const androidInfo = ua.match(/Android(?:\s[\d.]+)?;\s*([^)]*)/i)?.[1];
      const androidModel = androidInfo?.split(';').at(-1)
        .replace(/\s+(?:Build\/|wv\b).*$/i, '')
        .trim();
      if (androidModel && !/^(K|Mobile|wv|U|[a-z]{2}[-_][A-Z]{2})$/i.test(androidModel)) {
        return androidModel;
      }

      const windowsPhoneModel = ua.match(
        /Windows Phone(?: OS)?\s[^;)]*;\s*[^;)]*;\s*([^;)]+)/i
      )?.[1]?.trim();
      if (windowsPhoneModel) return windowsPhoneModel;

      return ua.match(/\(Mobile;\s*([^;)]+);[^)]*\).*KaiOS/i)?.[1]?.trim() || '';
    };

    const getBrowserName = (ua, brands = []) => {
      const uaRules = [
        [/MicroMessenger/i, 'WeChat'],
        [/AlipayClient/i, 'Alipay'],
        [/DingTalk/i, 'DingTalk'],
        [/MQQBrowser|QQBrowser/i, 'QQ'],
        [/baidubrowser|baiduboxapp/i, 'Baidu'],
        [/SogouMobileBrowser/i, 'Sogou'],
        [/360\s*Aphone|QihooBrowser/i, '360'],
        [/EdgA|EdgiOS|Edg\/|Edge\//i, 'Edge'],
        [/OPR\/|OPiOS/i, 'Opera'],
        [/SamsungBrowser/i, 'Samsung'],
        [/HuaweiBrowser/i, 'Huawei'],
        [/HeyTapBrowser/i, 'HeyTap'],
        [/MiuiBrowser/i, 'MIUI'],
        [/VivoBrowser/i, 'vivo'],
        [/UCBrowser|UCWEB/i, 'UC'],
        [/Quark/i, 'Quark'],
        [/CriOS|Chrome/i, 'Google'],
        [/FxiOS|Firefox/i, 'Firefox'],
        [/Safari/i, 'Safari']
      ];
      const uaResult = uaRules.find(([pattern]) => pattern.test(ua));
      if (uaResult) return uaResult[1];

      const brandNames = brands.map(({ brand }) => brand);
      if (brandNames.some((brand) => /Google Chrome/i.test(brand))) return 'Google';
      if (brandNames.some((brand) => /Microsoft Edge/i.test(brand))) return 'Edge';
      if (brandNames.some((brand) => /Opera/i.test(brand))) return 'Opera';
      if (brandNames.some((brand) => /^Chromium$/i.test(brand))) return 'Chromium';
      return '';
    };

    const getDeviceIdentity = (ua, platform, model, maxTouchPoints, modelBrands = {}) => {
      if (/iPhone/i.test(ua) || platform === 'iPhone') {
        return { brand: 'Apple', model: 'iPhone', name: 'Apple iPhone' };
      }
      if (/iPad/i.test(ua) || platform === 'iPad'
        || (platform === 'MacIntel' && maxTouchPoints > 1)) {
        return { brand: 'Apple', model: 'iPad', name: 'Apple iPad' };
      }
      if (/iPod/i.test(ua) || platform === 'iPod') {
        return { brand: 'Apple', model: 'iPod', name: 'Apple iPod' };
      }
      if (!model && /Windows Phone/i.test(ua)) {
        return { brand: 'Microsoft', model: 'Windows Phone', name: 'Microsoft Windows Phone' };
      }
      if (!model && /KaiOS/i.test(ua)) {
        return { brand: '', model: 'KaiOS Device', name: 'KaiOS Device' };
      }
      if (!model) return { brand: '', model: '', name: '' };

      const source = `${ua} ${model}`;
      const brandRules = [
        [/HONOR/i, 'HONOR'],
        [/HUAWEI/i, 'HUAWEI'],
        [/OPPO/i, 'OPPO'],
        [/\bvivo\b/i, 'vivo'],
        [/iQOO/i, 'iQOO'],
        [/Xiaomi|Redmi|\bMIX\b/i, 'Xiaomi'],
        [/POCO/i, 'POCO'],
        [/Samsung|SM-/i, 'Samsung'],
        [/OnePlus/i, 'OnePlus'],
        [/realme|RMX/i, 'realme'],
        [/Motorola|\bmoto\b/i, 'Motorola'],
        [/Pixel/i, 'Google'],
        [/Sony|Xperia/i, 'Sony'],
        [/Nokia|\bHMD\b/i, 'Nokia'],
        [/Meizu/i, 'Meizu'],
        [/RedMagic|NX\d/i, 'RedMagic'],
        [/nubia/i, 'nubia'],
        [/ZTE/i, 'ZTE'],
        [/ASUS|ZenFone|ROG Phone/i, 'ASUS'],
        [/Lenovo/i, 'Lenovo'],
        [/TECNO/i, 'TECNO'],
        [/Infinix/i, 'Infinix'],
        [/\bitel\b/i, 'itel'],
        [/Nothing/i, 'Nothing'],
        [/Fairphone/i, 'Fairphone'],
        [/Microsoft|Lumia/i, 'Microsoft'],
        [/TCL/i, 'TCL'],
        [/Alcatel/i, 'Alcatel'],
        [/Sharp|AQUOS/i, 'Sharp'],
        [/\bLG[- ]|LGE/i, 'LG'],
        [/HTC/i, 'HTC'],
        [/BlackBerry|BB10/i, 'BlackBerry']
      ];
      const brand = modelBrands[model.toUpperCase()]
        || brandRules.find(([pattern]) => pattern.test(source))?.[1]
        || '';

      const name = !brand
        ? ''
        : model.toLowerCase().startsWith(brand.toLowerCase()) ? model : `${brand} ${model}`;
      return { brand, model, name };
    };

    const formatDevice = ({ clientType, os, brand, model, deviceName, browserName }) => {
      const resolvedDeviceName = deviceName || [brand, model].filter(Boolean).join(' ');

      if (clientType === 'native') {
        if (os === 'ios') return `${brand || 'Apple'} ${model || 'iPhone 7,1'}`;
        return resolvedDeviceName || 'Unknown Device';
      }

      if (resolvedDeviceName && browserName) return `${resolvedDeviceName}-${browserName}`;
      if (resolvedDeviceName) return `${resolvedDeviceName} Browser`;
      if (browserName) return `Unknown Device-${browserName}`;
      return 'Unknown Device';
    };

    const render = (info) => {
      infoElement.replaceChildren(...Object.entries(info).map(([label, value]) => {
        const row = document.createElement('div');
        const term = document.createElement('dt');
        const description = document.createElement('dd');
        row.className = 'row';
        term.textContent = label;
        description.textContent = displayValue(value);
        row.append(term, description);
        return row;
      }));
    };

    async function detect() {
      copyButton.disabled = true;
      refreshButton.disabled = true;
      statusElement.textContent = '正在检测…';

      const userAgentData = navigator.userAgentData;
      let highEntropy = {};
      let userAgentDataError;

      if (userAgentData?.getHighEntropyValues) {
        try {
          highEntropy = await userAgentData.getHighEntropyValues([
            'platformVersion', 'model', 'architecture', 'bitness'
          ]);
        } catch (error) {
          userAgentDataError = error instanceof Error ? error.message : String(error);
        }
      }

      const model = getDeviceModel(navigator.userAgent, highEntropy.model);
      const browserName = getBrowserName(navigator.userAgent, userAgentData?.brands);
      const device = getDeviceIdentity(
        navigator.userAgent,
        navigator.platform,
        model,
        navigator.maxTouchPoints || 0,
        modelBrandCatalog
      );

      latestInfo = {
        'Device': formatDevice({
          clientType: 'h5',
          os: /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'ios' : 'android',
          brand: device.brand,
          model: device.model,
          deviceName: device.name,
          browserName
        }),
        'detected.brand': device.brand || undefined,
        'detected.model': device.model || undefined,
        'navigator.userAgent': navigator.userAgent,
        'navigator.platform': navigator.platform,
        'navigator.language': navigator.language,
        'screen.width': screen.width,
        'screen.height': screen.height,
        'devicePixelRatio': window.devicePixelRatio,
        'timezone': Intl.DateTimeFormat().resolvedOptions().timeZone,
        'userAgentData.brands': userAgentData?.brands,
        'userAgentData.mobile': userAgentData?.mobile,
        'userAgentData.platform': userAgentData?.platform,
        'userAgentData.platformVersion': highEntropy.platformVersion,
        'userAgentData.model': highEntropy.model,
        'fallback.modelFromUA': model && !highEntropy.model ? model : undefined,
        'userAgentData.architecture': highEntropy.architecture,
        'userAgentData.bitness': highEntropy.bitness
      };

      if (userAgentDataError) latestInfo['userAgentData.error'] = userAgentDataError;

      render(latestInfo);
      copyButton.disabled = false;
      refreshButton.disabled = false;
      statusElement.textContent = '检测完成';
    }

    async function copyAll() {
      const text = Object.entries(latestInfo)
        .map(([key, value]) => `${key}: ${displayValue(value)}`)
        .join('\n');

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        if (!copied) throw new Error('复制失败');
      }

      statusElement.textContent = '已复制全部信息';
    }

    copyButton.addEventListener('click', () => {
      copyAll().catch(() => {
        statusElement.textContent = '复制失败，请长按页面内容手动复制';
      });
    });
    refreshButton.addEventListener('click', detect);
    detect();
  </script>
</body>
</html>
